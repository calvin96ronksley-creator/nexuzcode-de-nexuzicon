<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="nexus-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4f46e5" />
      <stop offset="50%" stop-color="#7c3aed" />
      <stop offset="100%" stop-color="#06b6d4" />
    </linearGradient>
    <linearGradient id="nexus-glow" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f43f5e" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#fbbf24" stop-opacity="0.9" />
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="16" stdDeviation="24" flood-color="#000000" flood-opacity="0.45" />
    </filter>
  </defs>
  <rect width="512" height="512" rx="128" fill="url(#nexus-bg)" />
  <g filter="url(#shadow)" transform="translate(56, 56) scale(0.78)">
    <!-- Photo Frame / Nexus Canvas Symbol -->
    <rect x="40" y="40" width="432" height="432" rx="48" fill="#0f172a" fill-opacity="0.85" stroke="#ffffff" stroke-opacity="0.25" stroke-width="8" />
    <!-- Mountain / Vector Graphic Polygon -->
    <path d="M80 380 L180 230 L260 330 L340 180 L432 380 Z" fill="url(#nexus-glow)" />
    <!-- Sun / Aperture Sparkle -->
    <circle cx="340" cy="140" r="44" fill="#ffffff" fill-opacity="0.95" />
    <circle cx="340" cy="140" r="58" stroke="#38bdf8" stroke-width="6" fill="none" opacity="0.8" />
    <!-- Sparkles -->
    <path d="M140 120 L150 90 L160 120 L190 130 L160 140 L150 170 L140 140 L110 130 Z" fill="#fbbf24" />
  </g>
</svg>
